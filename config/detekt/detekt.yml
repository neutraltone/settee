# Overrides on top of detekt's default config (buildUponDefaultConfig = true).

naming:
  FunctionNaming:
    # Composables are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*|[A-Z][A-Za-z0-9]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true

  ForbiddenImport:
    # Corners come from SetteeShapes so they stay on docs/LOOK.md's scale (ADR 0006); only ui/design
    # makes its own. Never add an entry for this to app/detekt-baseline.xml. Material 3 isn't a
    # dependency any more (#170), so its widgets need no rule here.
    # A wildcard import can't get round the list: detekt's WildcardImport rule already fails it.
    active: true
    excludes: ['**/ui/design/**', '**/test/**']
    imports:
      - 'androidx.compose.foundation.shape.RoundedCornerShape'

performance:
  SpreadOperator:
    # Flags an array copy per call; every spread here runs once (e.g. per database build).
    active: false

complexity:
  LongParameterList:
    # Composables take their state and callbacks as parameters by design.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  ModifierClickableOrder:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  RememberContentMissing:
    active: true
  UnstableCollections:
    active: true
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
