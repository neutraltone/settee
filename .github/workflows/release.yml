name: Release

# release-please.yml calls this once it has tagged a release. Run it by hand only to rebuild an
# existing release's APK.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test

      # Only runs if a keystore has been added to repository secrets. Without one the
      # release build falls back to the debug key, which still produces an installable
      # APK — see docs/RELEASING.md.
      # The secrets context is not usable directly in an `if:`, so it is lifted into env first.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Two copies of the same APK: the fixed-name settee.apk makes releases/latest/download/settee.apk
      # always serve the newest build (the Downloader short code points there), and the versioned
      # one is what the in-app updater picks, so a downloaded file says which version it is.
      - name: Name the artifact
        id: artifact
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK was produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist
          cp "$SOURCE" "dist/settee-${TAG}.apk"
          cp "$SOURCE" "dist/settee.apk"
          echo "path=dist/settee-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "signed=$([ -n "$KEYSTORE_PATH" ] && echo yes || echo debug-key)" >> "$GITHUB_OUTPUT"

      # release-please writes headings as "## [0.2.0](compare link) (date)".
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ ("^## \\[?" v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See the changelog for what is new in this release." > release-notes.md; fi
          {
            echo ""
            echo "---"
            echo "Built by GitHub Actions from the tagged commit — the workflow is public, so anyone can verify this APK against the source."
          } >> release-notes.md

      # release-please has already created the release; this attaches the APKs to it.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.apk
          generate_release_notes: false
          body_path: release-notes.md
