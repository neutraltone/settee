name: Release

# release-please.yml calls this once it has tagged a release. Run it by hand only to rebuild an
# existing release's APK.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: write
  # To read Build's "Test and assemble" result for the tagged commit.
  checks: read

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    # A hung test run fails the release rather than sitting for six hours. Waiting for Build takes up
    # to 30 minutes, and a test run here usually 7.
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Before the tests so a release without the secrets fails in seconds, not after a full build.
      # Gradle would fall back to the debug key, and a debug-key APK cannot be upgraded by (or
      # upgrade) a release-signed one — see docs/RELEASING.md.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No release keystore is configured. Add the signing secrets — see docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Without these the release would quietly ship without OpenSubtitles, TMDB or crash reports. The
      # build itself still allows them blank (local builds, forks, PR CI) and refuses one in the wrong
      # format (buildSrc/BuiltInKeys.kt), so only a release checks they are set (#628).
      #
      # Then asks the services, since a key in the right format can still be the wrong one, or turned
      # down: v1.5.0 shipped a GitHub token as its OpenSubtitles key. That fails only on each
      # service's own invalid-key answer; a service that is down or behind a challenge page is a
      # warning, never a blocked release.
      #
      # One step, so the secrets are listed once for both checks. Not job-level env: the Unit tests
      # step must not see them, as the app's tests assume no built-in keys.
      - name: Built-in keys are set and work
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          missing=0
          for name in OPENSUBTITLES_API_KEY TMDB_API_KEY SENTRY_DSN; do
            if [ -z "${!name}" ]; then
              echo "::error::The ${name} secret is blank. Set it — see docs/RELEASING.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # A manual rebuild of an older tag may predate the script.
          if [ ! -f tools/keys/check_keys.py ]; then
            echo "::warning::${TAG} has no tools/keys/check_keys.py, so the keys weren't checked with the services."
            exit 0
          fi
          python3 tools/keys/check_keys.py

      # The tagged commit is on main, where Build's "Test and assemble" runs the whole suite on it. A
      # second run here could only re-roll a flaky test, and that blocked v1.4.0, which Build had
      # passed, three times. So Build's verdict is used, waiting for it if it is still running, and the
      # suite runs here only when there is no pass to use: Build failed, was cancelled, never ran (an
      # old tag), or hasn't finished within 30 minutes.
      - name: Did Build pass this commit?
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          while :; do
            # The newest run of the check, as "status conclusion url"; "none none none" when there is none.
            read -r status conclusion url < <(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=Test%20and%20assemble" \
              --jq '(.check_runs | sort_by(.started_at) | last) // {} | "\(.status // "none") \(.conclusion // "none") \(.html_url // "none")"')
            if [ "$status" = completed ]; then break; fi
            # Build starts on the same push as this, so a missing check is one that never ran.
            if [ "$status" = none ] && [ "$SECONDS" -ge 120 ]; then break; fi
            if [ "$SECONDS" -ge 1800 ]; then break; fi
            sleep 30
          done
          if [ "$conclusion" = success ]; then
            echo "Build's Test and assemble passed ${SHA}: ${url}"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No passing Test and assemble for ${SHA} (${status}, ${conclusion}), so the tests run here."
          fi

      - name: Unit tests
        if: steps.build.outputs.passed != 'true'
        run: ./gradlew test

      - name: Assemble release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Settee's one OpenSubtitles key, its TMDB key and its Sentry DSN, checked above.
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Uploads this release's R8 mapping to Sentry, under the id baked into the APK that the
          # release's crash reports carry, so their stack traces show real names (#577). Without
          # the token the build skips the upload and the release's reports stay obfuscated.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: ./gradlew assembleRelease

      # Two copies of the same APK: the fixed-name settee.apk makes releases/latest/download/settee.apk
      # always serve the newest build (the Downloader short code points there), and the versioned
      # one is what the in-app updater picks, so a downloaded file says which version it is.
      - name: Name the artifact
        id: artifact
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK was produced by assembleRelease"
            exit 1
          fi
          mkdir -p dist
          cp "$SOURCE" "dist/settee-${TAG}.apk"
          cp "$SOURCE" "dist/settee.apk"
          echo "path=dist/settee-${TAG}.apk" >> "$GITHUB_OUTPUT"

      # Checks the built APK itself, not just that the secrets were set: a wrongly signed APK will
      # not install over a release-signed one, so it must never be published. The keystore comes
      # from the same secrets as the signature, so it is also held to the certificate committed in
      # tools/release-cert.sha256, which no secret can change.
      - name: Verify signing certificate
        id: signing
        env:
          APK: ${{ steps.artifact.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          DIGEST=$(tools/check-apk-signer.sh "$APK" "$KEYSTORE_PATH" "$KEY_ALIAS" "$(cat tools/release-cert.sha256)")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # release-please writes headings as "## [0.2.0](compare link) (date)". The certificate digest
      # lets anyone check that a release is signed with the same key as the last one, which is what
      # decides whether it will install over it.
      - name: Release notes from CHANGELOG
        env:
          DIGEST: ${{ steps.signing.outputs.digest }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ ("^## \\[?" v "([^0-9]|$)"){f=1;next} /^## /{f=0} f{print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See the changelog for what is new in this release." > release-notes.md; fi
          {
            echo ""
            echo "---"
            echo "signed: yes"
            echo "certificate SHA-256: ${DIGEST}"
            echo ""
            echo "Built by GitHub Actions from the tagged commit — the workflow is public, so anyone can verify this APK against the source."
          } >> release-notes.md

      # release-please has already created the release; this attaches the APKs to it.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.apk
          generate_release_notes: false
          body_path: release-notes.md

  # Tells Sentry which commits went into the release and that it shipped, so a new crash shows its
  # suspect commits, an issue can be resolved in the next release, and one that comes back later is
  # marked as a regression (#622). Release health stays off in the app (ADR 0009), so this adds no
  # viewer data, only the repo's own history.
  #
  # A job of its own, after the APKs are published, because Sentry's action pulls a Docker image when
  # its job is set up, before any step can be skipped or allowed to fail: in the release job, that
  # registry being down would cost the release. It also keeps the image, which Sentry doesn't pin,
  # away from the release job's token that can write to the repo.
  sentry-release:
    name: Tell Sentry about the release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sentry being down is never a failed release.
    continue-on-error: true
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Release name, if there is a token
        id: sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Forks and rebuilds without secrets have no token; they skip the rest.
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then echo "token=true" >> "$GITHUB_OUTPUT"; fi
          # appVersionName, which is what crash reports name: the tag without its v.
          echo "release=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.sentry.outputs.token == 'true'
        with:
          ref: ${{ inputs.tag }}
          # The commits since the last release are worked out from the history, which a shallow
          # clone doesn't have.
          fetch-depth: 0
          # Nothing here pushes, and Sentry's container sees the checkout.
          persist-credentials: false

      - name: Sentry release
        if: steps.sentry.outputs.token == 'true'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: ${{ steps.sentry.outputs.release }}
          # A deploy records that the version shipped now, so only when release-please shipped it: an
          # old tag rebuilt by hand would otherwise become Sentry's newest deploy.
          environment: ${{ github.event_name != 'workflow_dispatch' && 'production' || '' }}
          set_commits: auto
          # The first release Sentry hears of has no previous one to count from.
          ignore_missing: true
          disable_telemetry: true
