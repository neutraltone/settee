name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each check is its own job so it shows as its own required status, and they run in parallel.
# setup-gradle shares one cache between them.
jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The release workflow runs this against the real key. Running it here against the debug
      # APK and AGP's debug keystore means a change in apksigner's or keytool's output breaks a
      # PR rather than the next release. AGP's keystore location depends on its version and on
      # ANDROID_USER_HOME/XDG settings, so it is found rather than assumed.
      - name: Signing check
        env:
          KEYSTORE_PASSWORD: android
        run: |
          KEYSTORE=$(find "$HOME" -name debug.keystore -not -path '*/hostedtoolcache/*' 2>/dev/null | head -n 1)
          if [ -z "$KEYSTORE" ]; then
            echo "::error::assembleDebug left no debug.keystore under $HOME"
            exit 1
          fi
          echo "Debug keystore: $KEYSTORE"
          tools/check-apk-signer.sh app/build/outputs/apk/debug/*.apk "$KEYSTORE" androiddebugkey

      # KSP rewrites app/schemas/ from the entities. A change here means an entity moved without
      # its schema being committed, or without a version bump (the current version's JSON was
      # overwritten) — RoomMigrationTest can't see either, so catch it here.
      - name: Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            git status --short -- app/schemas
            echo "::error::app/schemas/ changed during the build. Commit the new schema; if an existing version's JSON changed, bump the database version and add a Migration."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: settee-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

  detekt:
    name: detekt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: ignore

  screenshot-tools:
    name: Screenshot tools
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The Screenshots workflow never fails a PR (#44), so its comparison logic is tested here.
      - name: Comparison tests
        run: |
          pip install -r tools/screenshots/requirements.txt
          python3 -m unittest discover -s tools/screenshots

      # Only ever run by hand against a Stick, so nothing else would notice it breaking.
      - name: Stick measuring script tests
        run: python3 -m unittest discover -s tools/perf

      # Trusted to say whether a run passed, so what it reports is tested.
      - name: Check script tests
        run: python3 -m unittest discover -s tools/check

      # The mark's drawables and SVGs are generated, and a hand edit to one copy would drift.
      - name: Launcher artwork tests
        run: python3 -m unittest discover -s tools/launcher-art

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      # Full history: the PR range below needs the base branch, and pushes scan everything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary rather than gitleaks-action, which needs a licence key for organisation repos.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" gitleaks

      # Without --log-opts gitleaks scans `git log --all`, which after a full-depth checkout is every
      # branch on the remote, so a secret on one open PR's branch failed every other PR (#198 failed
      # on commits only #197 had). A PR scans base..HEAD instead: HEAD is the merge commit, so that is
      # every commit the PR adds, each one's own patch, so a secret added and reverted inside the PR
      # still fails. Pushes and manual runs scan everything reachable from HEAD, which is about a second.
      - name: Scan for credentials
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF..HEAD"
          else
            range="HEAD"
          fi
          echo "Scanning $range"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose --log-opts="$range"
