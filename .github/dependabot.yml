version: 2

# Prefixes make Dependabot's titles pass the PR title check (tools/check-message.sh):
# "build: Bump okhttp from 4.12.0 to 4.12.1".
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # Dependabot puts each dependency in the first group that matches, so toolchain comes
      # first and media3 precedes the androidx catch-all.
      #
      # AGP, the Gradle wrapper, Kotlin and KSP can't move independently: AGP 9 brings its own
      # Kotlin, new KSP needs new AGP, and new AGP needs new Gradle. Apart, each PR fails (#34).
      # The wrapper is matched by its "gradle-wrapper" name. Not org.jetbrains.kotlin*, which
      # would also swallow kotlinx-coroutines-test.
      toolchain:
        patterns: ['com.android.application*', 'com.android.tools.build:*', 'gradle-wrapper', 'org.jetbrains.kotlin:*', 'org.jetbrains.kotlin.*', 'com.google.devtools.ksp*']
      media3:
        patterns: ['androidx.media3:*']
      androidx:
        patterns: ['androidx.*']
      code-quality:
        patterns: ['io.gitlab.arturbosch.detekt*', 'io.nlopez.compose.rules:*', 'org.jlleitschuh.gradle.ktlint*', 'com.pinterest.ktlint*']
      testing:
        patterns: ['junit:*', 'com.google.truth:*', 'org.robolectric:*', 'org.jetbrains.kotlinx:kotlinx-coroutines-test']
      # Everything else (okhttp, coil, kotlinx, zxing, smbj, ...) in one weekly PR.
      other:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
